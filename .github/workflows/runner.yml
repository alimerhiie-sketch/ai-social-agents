name: Agent HQ runner

# Started by the Worker (workflow_dispatch) whenever work is queued, plus a nightly safety net.
# Does the heavy work: Claude Code agents on your subscription, painting, voice and Remotion rendering.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why the runner was started
        required: false
        default: manual
  schedule:
    - cron: "17 1 * * *" # 03:17 Beirut — after the nightly cycle has queued the day's work

concurrency:
  group: agent-hq-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      HQ_URL: ${{ secrets.HQ_URL }}
      HQ_SECRET: ${{ secrets.HQ_SECRET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # onnxruntime-node (Kokoro voice) would try to fetch a CUDA build on a fresh install and 404; the CPU build is all we use.
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Chrome libraries for Remotion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev \
            libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 fonts-noto-color-emoji >/dev/null

      # node_modules caches also hold the Kokoro voice model and Remotion's headless Chrome after the first run.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            studio/node_modules
          key: deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'studio/package-lock.json') }}-v1

      - name: Install
        run: |
          [ -d node_modules ] || npm ci --no-audit --no-fund
          [ -d studio/node_modules ] || (cd studio && npm ci --no-audit --no-fund)
          npm install -g @anthropic-ai/claude-code >/dev/null
          claude --version

      - name: Run queued jobs
        run: npx tsx cloud/runner.ts
